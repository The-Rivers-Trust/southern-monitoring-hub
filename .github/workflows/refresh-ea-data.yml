name: Refresh EA water quality data

on:
  schedule:
    # Weekly: the current and previous years.
    - cron: "17 4 * * 1"
    # Monthly: every year, to pick up older corrections.
    - cron: "43 4 1 * *"
  workflow_dispatch:
    inputs:
      all_years:
        description: Rebuild every year
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the data files
        env:
          ALL_YEARS: ${{ inputs.all_years == true || github.event.schedule == '43 4 1 * *' }}
        run: |
          if [ "$ALL_YEARS" = "true" ]; then
            node scripts/build-ea-data.mjs --all
          else
            node scripts/build-ea-data.mjs
          fi

      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ea
          git diff --cached --quiet || git commit -m "Refresh EA water quality data"
          git push
