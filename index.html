<!DOCTYPE html>
<html lang="en" class="calcite-mode-dark" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Southern Monitoring Hub</title>

  <link rel="stylesheet" id="arcgisThemeLink" href="https://js.arcgis.com/5.1/esri/themes/dark/main.css" />

  <!-- Applies a saved light-mode choice before anything paints. Keep the
       storage key in sync with THEME_STORAGE_KEY in js/theme.js. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("southernHubTheme"); } catch (e) {}
      if (saved === "light") {
        document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.className = "calcite-mode-light";
        document.getElementById("arcgisThemeLink").href = "https://js.arcgis.com/5.1/esri/themes/light/main.css";
      }
    })();
  </script>

  <link rel="stylesheet" href="https://js.arcgis.com/calcite-components/5.1.1/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/popup.css" />
</head>

<body>
  <calcite-shell>
    <calcite-navigation slot="header">
      <calcite-navigation-logo slot="logo" heading="Southern Monitoring Hub" icon="map"></calcite-navigation-logo>
      <div slot="content-end" class="headerActions">
        <calcite-select id="partnershipSelect" class="headerFilter" label="Catchment partnership" scale="s"></calcite-select>
        <calcite-action id="themeToggle" icon="brightness" text="Switch theme" title="Switch between dark and light"></calcite-action>
      </div>
    </calcite-navigation>

    <!-- Each tab title's data-view pairs with a <section data-view> below.
         The classification explorer only starts the first time it's opened. -->
    <div class="appFrame">
      <calcite-tab-nav class="viewTabs" id="viewTabs" scale="s">
        <calcite-tab-title data-view="monitoring" selected>Monitoring explorer</calcite-tab-title>
        <calcite-tab-title data-view="classification">EA Classification explorer</calcite-tab-title>
      </calcite-tab-nav>

      <div class="views">
    <section class="view appBody" data-view="monitoring">
      <aside class="sidePanel pickerPanel" aria-label="Choose a year and metric">
        <div class="yearFilter">
          <calcite-label layout="inline-space-between" scale="s">
            Year
            <calcite-select id="yearSelect" label="Year" scale="s"></calcite-select>
          </calcite-label>
        </div>
        <calcite-flow id="pickerFlow">
          <calcite-flow-item heading="Determinand">
            <calcite-list id="metricList" label="Determinand" selection-mode="single-persist" selection-appearance="highlight" scale="s"></calcite-list>
          </calcite-flow-item>
        </calcite-flow>
      </aside>

      <main class="mapArea">
        <div class="mapColumn">
          <arcgis-map id="map">
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <calcite-action id="layersAction" class="mapAction" slot="top-right" icon="layers" text="Map layers" title="Map layers: river network"></calcite-action>
            <arcgis-scale-bar slot="bottom-left" unit="metric"></arcgis-scale-bar>
          </arcgis-map>
          <calcite-panel id="infoPanel" class="infoPanel" closable closed>
            <calcite-action id="infoPrevious" slot="header-actions-end" icon="chevron-left" text="Previous reading" title="Previous reading" hidden></calcite-action>
            <calcite-action id="infoNext" slot="header-actions-end" icon="chevron-right" text="Next reading" title="Next reading" hidden></calcite-action>
            <div id="infoBody" class="infoBody"></div>
          </calcite-panel>
        </div>
        <calcite-panel id="layersPanel" class="toolPanel" heading="Map layers" closable closed></calcite-panel>
      </main>

      <aside class="sidePanel detailsPanel" id="details" aria-label="Legend and data sources">
        <p class="summary">Loading…</p>
      </aside>
    </section>

    <section class="view appBody" data-view="classification" hidden>
      <aside class="sidePanel pickerPanel" aria-label="Choose what to explore">
        <div class="viewControls">
          <calcite-segmented-control id="clsMode" label="Question" width="full" scale="s">
            <calcite-segmented-control-item value="coverage" checked>Coverage</calcite-segmented-control-item>
            <calcite-segmented-control-item value="change">Change</calcite-segmented-control-item>
            <calcite-segmented-control-item value="status">Status</calcite-segmented-control-item>
          </calcite-segmented-control>
          <p class="modeHint" id="clsModeHint"></p>
          <div class="modeOptions" id="clsModeOptions"></div>
        </div>
        <div class="pickerScroll">
          <calcite-list id="clsItemList" label="Classification item" selection-mode="single-persist" selection-appearance="highlight" scale="s"></calcite-list>
        </div>
      </aside>

      <main class="mapArea">
        <div class="mapColumn">
          <arcgis-map id="clsMap">
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <calcite-action id="clsLayersAction" class="mapAction" slot="top-right" icon="layers" text="Map layers" title="Map layers: river network"></calcite-action>
            <arcgis-scale-bar slot="bottom-left" unit="metric"></arcgis-scale-bar>
          </arcgis-map>
          <calcite-panel id="clsInfoPanel" class="infoPanel" closable closed>
            <div id="clsInfoBody" class="infoBody"></div>
          </calcite-panel>
        </div>
        <calcite-panel id="clsLayersPanel" class="toolPanel" heading="Map layers" closable closed></calcite-panel>
      </main>

      <aside class="sidePanel detailsPanel" id="clsDetails" aria-label="Legend and summary">
        <p class="summary">Loading…</p>
      </aside>
    </section>
      </div>
    </div>
  </calcite-shell>

  <script type="module" src="js/main.js"></script>
</body>
</html>
